<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>plugin probe</title>
<!-- 真实插件探针：点击按钮打开面板，检查 Grid、定位与懒加载数量 -->
<link rel="stylesheet" href="../dist/mk-emoji-picker.css">
<style>body{margin:0}</style>
</head>
<body>
<textarea id="content"></textarea>
<button id="btn" type="button"></button>
<script src="../dist/mk-emoji-picker.js"></script>
<script src="../dist/emoji-list.js"></script>
<script>
(function () {
    var picker = MkEmojiPicker.create('#content', {
        button: '#btn',
        animation: 'none',
        basePath: '../images/emoji',
        icons: mkEmojiLists
    });
    document.getElementById('btn').click();
    picker.loadVisible();
    var c = document.querySelector('.mkep-panel');
    var group = c.querySelector('.mkep-group:not([hidden])');
    var ul = group.querySelector('.mkep-grid');
    var cell = group.querySelector('.mkep-cell').getBoundingClientRect();
    document.title = 'RESULT:' + JSON.stringify({
        viewport: window.innerWidth,
        total: c.querySelectorAll('.mkep-grid img[data-src]').length,
        loaded: c.querySelectorAll('.mkep-grid img:not([data-src])').length,
        grid: getComputedStyle(ul).display,
        container: +c.getBoundingClientRect().width.toFixed(1),
        cellW: +cell.width.toFixed(1),
        cellH: +cell.height.toFixed(1),
        inlineLeft: c.style.left
    });
})();
</script>
</body>
</html>
